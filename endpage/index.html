<style>
  /* ---------- EDIT-COLORS ---------- */
  :root {
    --bg: #07070c;          /* page background (near black) */
    --panel: #101018;       /* rounded panel */
    --panel-border: #20202c;
    --text: #e6e6ef;
    --muted: #8a8a99;
    --label: #5c5c6e;
    /* shape colors: white/lavender, magenta, purple, orange */
    --c-white: #f2f2f8;
    --c-lavender: #b9a6f2;
    --c-magenta: #e845b8;
    --c-purple: #7c3aed;
    --c-orange: #fb923c;
  }

  @font-face {
    font-family: "Bungee";
    src: url("./fonts/bungee-latin-400-normal.woff2") format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: "Bungee Outline";
    src: url("./fonts/bungee-outline-latin-400-normal.woff2") format("woff2");
    font-weight: 400;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(0.75rem, 2.5vw, 2rem);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- panel ---------- */
  .panel {
    width: 100%;
    max-width: 1200px;
    min-height: min(80vh, 640px);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: clamp(1.2rem, 3vw, 2.2rem);
    padding: clamp(1.75rem, 5vw, 4rem);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: clamp(2rem, 6vh, 4rem);
  }

  /* ---------- top: name + info columns ---------- */
  .top {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start;
    gap: 2rem 3rem;
  }

  .name {
    font-family: "Bungee Outline", "Bungee", sans-serif;
    font-size: clamp(2.6rem, 9.5vw, 7rem);
    line-height: 1.02;
    letter-spacing: 0.01em;
    color: var(--text);
    text-transform: uppercase;
  }

  .name .line { display: block; overflow: hidden; }
  .name .line > span {
    display: block;
    transform: translateY(115%);
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .name .line:nth-child(2) > span { animation-delay: 0.15s; }

  .cols {
    display: flex;
    gap: clamp(2.5rem, 6vw, 5rem);
    padding-top: 0.5rem;
    opacity: 0;
    transform: translateY(20px);
    animation: fade-up 0.8s 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .cols h3 {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--label);
    margin-bottom: 0.9rem;
  }
  .cols ul { list-style: none; }
  .cols li { margin-bottom: 0.45rem; font-size: 0.85rem; }
  .cols a {
    color: var(--text);
    text-decoration: none;
    position: relative;
    transition: color 0.25s ease;
  }
  .cols a::after {
    content: "";
    position: absolute;
    left: 0; bottom: -2px;
    width: 100%; height: 1px;
    background: var(--c-magenta);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .cols a:hover { color: var(--c-lavender); }
  .cols a:hover::after { transform: scaleX(1); }
  .cols .dim { color: var(--muted); }

  /* ---------- shapes row ---------- */
  .shapes {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: center;
    gap: clamp(0.5rem, 2vw, 1.5rem);
  }
  .shape {
    width: clamp(44px, 7vw, 76px);
    height: clamp(44px, 7vw, 76px);
    display: block;
    cursor: default;
    opacity: 0;
    transform: scale(0);
    animation:
      pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
      drift 5s ease-in-out infinite alternate;
    animation-delay: var(--d), calc(var(--d) + 0.7s);
    transition: transform 0.3s ease;
  }
  .shape:hover { transform: scale(1.15) rotate(-8deg); }
  .shape svg { width: 100%; height: 100%; display: block; }

  /* ---------- keyframes (transform + opacity only) ---------- */
  @keyframes rise {
    to { transform: translateY(0); }
  }
  @keyframes fade-up {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pop {
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes drift {
    from { transform: translateY(0) rotate(0deg); }
    to   { transform: translateY(-9px) rotate(5deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .name .line > span,
    .cols,
    .shape { animation: none; opacity: 1; transform: none; }
    .shape:hover { transform: none; }
  }
</style>
</head>
<body>

      <!-- 7. magenta stripes -->

    </div>
  </main>
</body>
</html>
